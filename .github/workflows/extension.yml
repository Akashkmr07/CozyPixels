name: Build and Deploy Extension

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'

jobs:
  build-and-commit-extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Zip extension directory
        run: |
          cd extension
          zip -r ../cozy-engine.zip .
          cd ..

      - name: Move zip to frontend/public
        run: |
          mkdir -p frontend/public
          mv cozy-engine.zip frontend/public/cozy-engine.zip

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/public/cozy-engine.zip
          git diff-index --quiet HEAD || (git commit -m "chore: auto-build extension zip [skip ci]" && git push)
